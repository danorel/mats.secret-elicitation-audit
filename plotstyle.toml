# styles-plot vocabulary for mats.esk-audit (styles-plot's docs/ADOPTING.md; version pinned in requirements.txt).
# Every word a figure prints that names a concept of this project lives here; the status of every drawn cell lives in
# plots/status.csv. Figures: `make figures` (scripts in plots/, PNGs in figures/<target>/, their styles-plot sidecars
# in figures/_meta/<target>/, the numbers they read in derived/user_gender/).

[project]
name = "esk-audit"

# ---- roles: one colour, one meaning, in every figure ------------------------------------------------------------------
[roles.method]
slot = "violet"
word = "gender direction"
meaning = "the gender direction and the layer-11 readout it located (Acts Tokens at layer 11)"

[roles.readout]
slot = "teal"
word = "sign-separability"
meaning = "classifying each item by the sign of its projection on the direction (no decode, no auditor)"

# ---- the grey things --------------------------------------------------------------------------------------------------
[controls]
names = [
    "the paper's baselines",
    "the published layer (23)",
    "the other methods",
    "other directions",
    "non-pronoun positions",
    "a random direction",
    "the base model",
]

[key.bands]
uncentered = "constant sign: an artifact of the uncentered readout"

[intervals]
ci95 = "95% CI (prompt-level bootstrap)"
iqr = "interquartile range"

# ---- number formats ---------------------------------------------------------------------------------------------------
[formats.signed_points]
decimals = 1
sign = true

[formats.rank]
decimals = 0

[formats.percent1]
decimals = 1

[formats.cosine]
decimals = 2
sign = true

[formats.gap]
decimals = 2

# ---- units: axis title (with its denominator), cue quantity, format -----------------------------------------------------
[units.accuracy]
title = "auditor accuracy (%)"
quantity = "accuracy"
format = "accuracy"

[units.signal]
title = "accuracy minus the method's own blank-evidence baseline (points)"
quantity = "difference"
format = "signed_points"
cue_word = "larger"

[units.rank]
title = "rank of the best gender word, lower is better, drawn upward (log scale)"
quantity = "rank"
format = "rank"
scale = "log"
cue = false

[units.layer]
title = "layer"
format = "z"
cue = false

[units.separability]
title = "items classified correctly by sign (%)"
quantity = "separability"
format = "percent1"

[units.projection_gap]
title = "female − male mean projection"
quantity = "gap"
format = "gap"
cue_word = "larger"

[units.cosine]
title = "cosine with the fine-tuning change (female − male)"
quantity = "cosine"
format = "cosine"
cue_word = "larger"

[units.variance_share]
title = "share of variance"
quantity = "variance"
format = "share"
cue = false

[units.prompts]
title = "unique prompts"
quantity = "prompts"
format = "z"

[units.projection]
title = "projection on the gender direction (positive = female side, negative = male side)"
quantity = "projection"
format = "z"
cue_word = "larger"

# ---- words ------------------------------------------------------------------------------------------------------------
[terms]
canonical = [
    "auditor accuracy", "chance", "layer 11", "layer 23 (published)", "blank-evidence baseline",
    "accuracy over the blank-evidence baseline",
    "direct set", "standard set",
    "rank", "separability", "accuracy",
    "cosine", "projection gap",
    "UMAP", "PCA", "layer 10", "layer 25",
    "fine-tuned checkpoints", "base model", "Acts Tokens",
    "fails completely (0.0)", "partial (0.1 to 0.8)", "succeeds cleanly (0.9 to 1.0)",
]
templates = [
    "PCA (PC1 {num}, PC2 {num})",
    "best white-box, SAE Desc (reproduced): {num}",
    "best black-box, prefill (published, not rerun): {num}",
]
missing = ["no run", "no interval"]
not_claimed = []

[[terms.banned]]
pattern = "Gender Direction"
use = "gender direction"

[[terms.banned]]
pattern = "ours"
use = "gender direction"

[[terms.banned]]
pattern = "pp"
use = "points"

# ---- entities: ordered rows per kind ----------------------------------------------------------------------------------
# Methods in METRICS.md's table order (the paper's), with the layer-11 readout directly under Acts Tokens at layer 23.
[[entities.methods]]
key = "io"
name = "I/O (no evidence)"

[[entities.methods]]
key = "logit_lens"
name = "Logit Lens Tokens"

[[entities.methods]]
key = "residual_tokens"
name = "Acts Tokens, layer 23"

[[entities.methods]]
key = "acts_tokens_l11"
name = "Acts Tokens, layer 11 (= gender direction)"

[[entities.methods]]
key = "sae_feature_descriptions"
name = "SAE Desc"

[[entities.methods]]
key = "sae_tokens"
name = "SAE Tokens"

# blank_baseline_signal_chart.py's rows, in its METHODS order (direct set)
[[entities.signal_rows]]
key = "acts_desc"
name = "Acts Desc"

[[entities.signal_rows]]
key = "acts_tokens"
name = "Acts Tokens, layer 23"

[[entities.signal_rows]]
key = "acts_tokens_l11"
name = "Acts Tokens, layer 11"

[[entities.signal_rows]]
key = "sae_desc"
name = "SAE Desc"

# layer_shift_chart.py: the headline dumbbell
[[entities.headline]]
key = "acts_tokens"
name = "Acts Tokens, direct set"

[[entities.checkpoints]]
key = "female"
name = "female checkpoint"

[[entities.checkpoints]]
key = "male"
name = "male checkpoint"

[[entities.prompt_sets]]
key = "direct"
name = "direct set"

[[entities.prompt_sets]]
key = "standard"
name = "standard set"

# bimodal_breakdown_chart_combined.py: checkpoint × prompt set
[[entities.checkpoint_sets]]
key = "female_direct"
name = "female checkpoint · direct set"

[[entities.checkpoint_sets]]
key = "male_direct"
name = "male checkpoint · direct set"

[[entities.checkpoint_sets]]
key = "female_standard"
name = "female checkpoint · standard set"

[[entities.checkpoint_sets]]
key = "male_standard"
name = "male checkpoint · standard set"

# semantic_null_cosine_control.py's CONTROL_AXES, then the Gaussian control, then the real direction
[[entities.directions]]
key = "formality"
name = "formality"

[[entities.directions]]
key = "tense"
name = "tense"

[[entities.directions]]
key = "topic"
name = "topic"

[[entities.directions]]
key = "sentiment"
name = "sentiment"

[[entities.directions]]
key = "random"
name = "random (Gaussian)"

[[entities.directions]]
key = "gender"
name = "gender direction (real)"

# non_pronoun_position_gap.py's CONTROL_POSITIONS, then the pronoun-mean reference
[[entities.positions]]
key = "bos"
name = "BOS"

[[entities.positions]]
key = "last_user_token"
name = "last user-turn token"

[[entities.positions]]
key = "midpoint_user_token"
name = "user-turn midpoint"

[[entities.positions]]
key = "pronoun_mean"
name = "pronoun mean (reference)"

[registry]
path = "plots/status.csv"

[output]
sidecar_dir = "_meta"
